name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-lock.txt

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install from lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Install development dependencies
        run: pip install -r requirements-dev.txt

      - name: Test
        run: pytest --cov=. --cov-fail-under=75 --cov-report=term

      - name: Lint
        run: ruff check main.py generate_images_helper.py logging_config.py tests

      - name: Typecheck
        run: mypy main.py generate_images_helper.py logging_config.py

      - name: Audit dependencies
        run: pip-audit -r requirements.txt --no-deps --disable-pip

  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Smoke test docker compose
        run: docker compose up --build --abort-on-container-exit

      - name: Assert output video exists
        run: test -s output/Test_Lemon.mp4
