[project]
name = "triple-perigee"
version = "0.1.0"
description = "Python CLI that turns JSON scripts into videos with TTS and Ken Burns effects."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["video", "tts", "cli", "moviepy", "automation", "ken-burns"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "moviepy==1.0.3",
    "edge-tts==7.2.8",
    "numpy==1.26.4",
    "Pillow==12.3.0",
    "proglog==0.1.12",
    "pydantic==2.13.4",
    "python-json-logger==3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.3",
    "pip-audit==2.9.0",
    "pip-tools==7.4.1",
    "mypy==1.13.0",
]

[tool]
project_type = "cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore:invalid escape sequence:DeprecationWarning",
    "ignore:ANTIALIAS is deprecated:DeprecationWarning",
    "ignore:Starting with ImageIO:DeprecationWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501"]

[tool.coverage.run]
branch = true
source = ["main", "generate_images_helper", "logging_config"]

[tool.coverage.report]
fail_under = 75
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == [\"']__main__[\"']:",
]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
files = [
    "main.py",
    "generate_images_helper.py",
    "logging_config.py",
]
